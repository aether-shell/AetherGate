name: AetherGate Image
run-name: AetherGate image ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full current main SHA; CI and Security Scan must already be green
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: aethergate-image
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'aether-shell/AetherGate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ inputs.commit }}
      IMAGE: ghcr.io/aether-shell/aethergate:sha-${{ github.sha }}
    steps:
      - name: Bind workflow to exact source
        run: |
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require same-commit checks
        run: python3 tools/aethergate/ag.py gate --sha "$SOURCE_SHA" --output /tmp/aethergate-gates.json
      - uses: docker/setup-buildx-action@v3
      - name: Resolve build metadata
        run: |
          printf 'AG_VERSION=%s-aethergate.%s\n' "$(cat backend/cmd/server/VERSION)" "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          printf 'AG_DATE=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build on GitHub runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            VERSION=${{ env.AG_VERSION }}
            COMMIT=${{ github.sha }}
            DATE=${{ env.AG_DATE }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=aethergate-amd64
          cache-to: type=gha,mode=max,scope=aethergate-amd64
      - name: Isolated image and managed API smoke
        run: python3 tools/aethergate/smoke.py "$IMAGE" "$SOURCE_SHA"
      - name: Sign in with temporary workflow token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish verified image and evidence
        run: |
          python3 tools/aethergate/ag.py gate --sha "$SOURCE_SHA"
          docker push "$IMAGE"
          DIGEST=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          mkdir -p /tmp/aethergate-release
          python3 tools/aethergate/ag.py manifest --sha "$SOURCE_SHA" --image "$DIGEST" --output /tmp/aethergate-release/release.json
          printf 'Verified image: %s\n\nSource: %s\n' "$DIGEST" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: aethergate-release
          path: /tmp/aethergate-release/release.json
          retention-days: 90
          if-no-files-found: error
